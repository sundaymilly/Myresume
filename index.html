.glass{background:var(--gl);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--gb);box-shadow:0 10px 40px rgba(15,23,42,.1),inset 0 1px 0 rgba(255,255,255,.85);border-radius:22px}

  align-items: center;
  justify-content: center;

  font-size: 34px;
  font-weight: 800;
  border: 4px solid #fff;
  box-shadow: 0 8px 28px rgba(26, 90, 140, 0.3);

  overflow: hidden;

}
.av:hover {

}
.av img {

  height: 100%;

  object-position: center;
  border-radius: 50%;
  display: block;
}

  width: 18px;
  height: 18px;
  background: #22c55e;

}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;z-index:120;padding:10px 20px;border-radius:30px;font-size:13px;font-weight:600;color:#fff;background:#0f172a;transition:.35s;pointer-events:none}

  h:()=>`<div class="sub">Education</div>`+R.edu.map(e=>`<div class="card"><div class="eh"><h3>${esc(e.t)}</h3><span class="dt">${esc(e.d)}</span></div><div class="org">${esc(e.o)}</div><ul><li>${esc(e.n)}</li></ul></div>`).join('')+
   `<div class="sub" style="margin-top:20px">Certifications</div><div class="g2">${R.certs.map(c=>`<div class="card"><h3 style="font-size:14px">${esc(c[0])}</h3><div class="org" style="margin:3px 0 0">${esc(c[1])} · ${c[2]}</div></div>`).join('')}</div>`},
 {k:'Achievements',i:'fa-trophy',s:'Measurable results and milestones',
  h:()=>R.ach.map(a=>`<div class="card ach"><i class="fas ${a[0]}"></i><div><h3>${esc(a[1])}</h3><p>${esc(a[2])}</p></div></div>`).join('')},
 {k:'Documents',i:'fa-folder-open',s:'Certificates and supporting documents',
  h:()=>`<div class="gal">${R.docs.map(d=>`<div class="card doc" role="button" tabindex="0" onclick="openImg('${esc(d[0])}','${esc(d[1])}')" onkeydown="if(event.key==='Enter')this.click()"><div class="th"><img loading="lazy" src="${esc(d[0])}" alt="${esc(d[1])}" onerror="this.replaceWith(Object.assign(document.createElement('i'),{className:'fas fa-image'}))"></div><h3>${esc(d[1])}</h3><p>${esc(d[2])}</p></div>`).join('')}</div>`},
 {k:'Contact',i:'fa-paper-plane',s:'Languages, contact details and resume',
  h:()=>`<div class="g2">`+[['fa-envelope','Email',R.email,'mailto:'+R.email],['fa-location-dot','Location',R.loc,'#'],['fa-brands fa-linkedin-in','LinkedIn',R.li,'https://www.'+R.li],['fa-brands fa-github','GitHub',R.gh,'https://'+R.gh]].map(c=>`<div class="card"><a class="ct" href="${c[3]}" target="_blank" rel="noopener"><i class="${c[0].includes('brands')?c[0]:'fas '+c[0]}"></i><div><small>${c[1]}</small><span>${esc(c[2])}</span></div></a></div>`).join('')+`</div>`+
   `<div class="sub" style="margin-top:18px">Languages</div><div class="chips">${R.langs.map(l=>`<span class="chip"><i class="fas fa-language"></i>${l[0]} · ${l[1]}</span>`).join('')}</div>`+
   `<div class="sub" style="margin-top:22px">Download my resume</div><div class="cta"><button onclick="dlResume('pdf')"><i class="fas fa-file-pdf"></i>As PDF</button><button onclick="dlResume('doc')"><i class="fas fa-file-word"></i>As Word</button><button onclick="dlResume('txt')"><i class="fas fa-file-lines"></i>As Text</button></div>`}
];
const $=id=>document.getElementById(id);
$('book').innerHTML=PG.map((p,i)=>`<section class="page glass" data-s="${i?'future':'active'}">${hd(i+1,p.k,p.s)}${p.h()}</section>`).join('');
$('nav').innerHTML=PG.map((p,i)=>`<button class="nv" data-i="${i}"><i class="fas ${p.i}"></i>${p.k}<em>${String(i+1).padStart(2,'0')}</em></button>`).join('');
$('dots').innerHTML=PG.map((p,i)=>`<button data-i="${i}" aria-label="${p.k}"></button>`).join('');
const pages=[...document.querySelectorAll('.page')];let cur=0;
function go(n){
 if(n<0||n>=pages.length||n===cur)return;
 pages.forEach(p=>p.style.zIndex=1);
 (n>cur?pages[cur]:pages[n]).style.zIndex=10;(n>cur?pages[n]:pages[cur]).style.zIndex=5;
 pages.forEach((p,i)=>p.dataset.s=i<n?'past':i===n?'active':'future');
 cur=n;pages[n].scrollTop=0;ui();
}
function ui(){
 document.querySelectorAll('.nv').forEach((b,i)=>b.classList.toggle('on',i===cur));
 document.querySelectorAll('#dots button').forEach((b,i)=>b.classList.toggle('on',i===cur));
 $('pgLbl').textContent=`${cur+1} / ${PG.length} · ${PG[cur].k}`;
 $('prev').disabled=cur===0;$('next').disabled=cur===PG.length-1;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)go(+b.dataset.i)});
$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);if(e.key==='Escape')$('modal').classList.remove('on')});
let tx=0,ty=0;const bk=$('book');
bk.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
bk.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>70&&Math.abs(dy)<50)go(cur+(dx<0?1:-1))});
/* shared lightbox: avatar + document thumbnails */
function openImg(src,alt){const m=$('mImg');m.src=src;m.alt=alt||'';$('modal').classList.add('on')}
$('avatar').onclick=()=>openImg('milly.jpeg','Naphtali Sunday');
$('modal').onclick=()=>$('modal').classList.remove('on');
ui();
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}

/* ============ RESUME EXPORTS ============ */
const FN='Naphtali_Sunday_Resume';
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function dlResume(f){try{({pdf:buildPdf,doc:buildDoc,txt:buildTxt})[f]();toast('Resume downloaded ('+f.toUpperCase()+')')}catch(e){console.error(e);toast('Could not create '+f.toUpperCase()+'. Please try again.')}}

/* ---- PDF (vector text via jsPDF: selectable, crisp, auto-paginated) ---- */
function buildPdf(){
 if(!window.jspdf)throw new Error('jsPDF not loaded');
 const d=new window.jspdf.jsPDF({unit:'pt',format:'a4'}),W=595.28,H=841.89,M=42,CW=W-2*M,ac=[26,90,140],dk=[15,23,42],bd2=[60,72,88];
 let y=0;
 const need=h=>{if(y+h>H-50){d.addPage();y=M}};
 const font=(st,sz,c)=>{d.setFont('helvetica',st);d.setFontSize(sz);d.setTextColor(...c)};
 const sec=t=>{need(48);y+=8;font('bold',10.5,ac);d.text(A(t).toUpperCase(),M,y);d.setDrawColor(ac[0],ac[1],ac[2]);d.setLineWidth(.8);d.line(M,y+5,W-M,y+5);y+=20};
 const para=(s,sz=9.5,c=bd2)=>{font('normal',sz,c);d.splitTextToSize(A(s),CW).forEach(l=>{need(sz*1.5);d.text(l,M,y);y+=sz*1.45})};
 const bl=s=>{font('normal',9.5,bd2);const L=d.splitTextToSize(A(s),CW-18);L.forEach((l,i)=>{need(13.5);if(i){font('normal',9.5,bd2)}else{font('bold',9.5,ac);d.text('•',M+5,y);font('normal',9.5,bd2)}d.text(l,M+18,y);y+=13.2});y+=1.5};
 const entry=(t,dt,o)=>{need(58);font('bold',11,dk);d.text(A(t),M,y);font('normal',9,[100,116,139]);d.text(A(dt),W-M,y,{align:'right'});y+=13;font('bold',9.5,ac);d.splitTextToSize(A(o),CW).forEach(l=>{d.text(l,M,y);y+=12.5});y+=2};
 // header band
 d.setFillColor(...ac);d.rect(0,0,W,104,'F');d.setFillColor(42,122,191);d.rect(0,98,W,6,'F');
 font('bold',25,[255,255,255]);d.text(R.name.toUpperCase(),M,48);
 font('normal',11.5,[219,234,254]);d.text(A(R.title).replace(/ \| /g,'  |  '),M,67);
 font('normal',9,[255,255,255]);d.text(A([R.loc,R.email].join('   |   ')),M,86);
 font('normal',9,[219,234,254]);d.text(A('in/'+R.li.split('/in/')[1]+'   |   '+R.gh),W-M,86,{align:'right'});
 y=128;
 // stats
 const bw=(CW-30)/4;
 R.stats.forEach((s,i)=>{const x=M+i*(bw+10);d.setFillColor(238,244,251);d.roundedRect(x,y,bw,46,6,6,'F');font('bold',17,ac);d.text(s[0],x+bw/2,y+21,{align:'center'});font('normal',7.5,[100,116,139]);d.text(A(s[1]).toUpperCase(),x+bw/2,y+35,{align:'center'})});
 y+=62;
 sec('Professional Summary');para(summary(),9.8);
 sec('Technical Skills');
 R.skills.forEach(([c,items])=>{const L=d.splitTextToSize(A(items.join(', ')),CW);need(L.length*13+16);font('bold',9.5,dk);d.text(A(c),M,y);y+=12.5;font('normal',9.5,bd2);L.forEach(l=>{d.text(l,M+10,y);y+=13});y+=4});
 sec('Professional Experience');
 R.exp.forEach(e=>{entry(e.t,e.d,e.o);e.b.forEach(bl);y+=5});
 sec('Education');
 R.edu.forEach(e=>{entry(e.t,e.d,e.o);bl(e.n)});
 sec('Certifications');
 R.certs.forEach(c=>{need(14);font('bold',9.5,dk);d.text(A(c[0]),M,y);font('normal',9.5,bd2);d.text(A(c[1]),M+250,y);d.text(c[2],W-M,y,{align:'right'});y+=14});
 sec('Key Achievements');
 R.ach.forEach(a=>{need(26);font('bold',9.8,dk);d.text(A(a[1]),M,y);y+=12.5;font('normal',9.5,bd2);d.splitTextToSize(A(a[2]),CW).forEach(l=>{need(13);d.text(l,M,y);y+=13});y+=4});
 sec('Languages');
 para(R.langs.map(l=>l[0]+' ('+l[1]+')').join('     |     '));
 y+=8;font('italic',9,[100,116,139]);need(14);d.text('References available upon request.',W/2,y,{align:'center'});
 const n=d.getNumberOfPages();
 for(let i=1;i<=n;i++){d.setPage(i);font('normal',8,[148,163,184]);d.setDrawColor(226,232,240);d.setLineWidth(.5);d.line(M,H-34,W-M,H-34);d.text(R.name+'  |  Resume',M,H-22);d.text('Page '+i+' of '+n,W-M,H-22,{align:'right'})}
 d.setProperties({title:R.name+' - Resume',author:R.name,subject:R.title.replace(/·/g,'|')});
 d.save(FN+'.pdf');
}

/* ---- WORD (.doc, Word-compatible HTML with real headings, lists and tables) ---- */
function buildDoc(){
 const e=esc;
 const ent=(t,dt,o)=>`<table width="100%" cellpadding="0" cellspacing="0" style="margin-top:9pt"><tr><td><h3>${e(t)}</h3></td><td class="dt" align="right">${e(dt)}</td></tr></table><p class="org">${e(o)}</p>`;
 const ul=a=>`<ul>${a.map(x=>`<li>${e(x)}</li>`).join('')}</ul>`;
 let h=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${e(R.name)} - Resume</title>
<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->
<style>@page{size:A4;margin:1.7cm 1.8cm}body{font-family:Calibri,Arial,sans-serif;font-size:10.5pt;color:#1e293b;line-height:1.35}
h1{font-size:24pt;color:#fff;margin:0;letter-spacing:1pt}h2{font-size:12pt;color:#1a5a8c;border-bottom:1.5pt solid #1a5a8c;margin:15pt 0 5pt;text-transform:uppercase;padding-bottom:2pt}
h3{font-size:11pt;color:#0f172a;margin:0}p{margin:2pt 0}ul{margin:2pt 0 4pt 16pt;padding:0}li{margin:1.5pt 0}td{vertical-align:top}
.org{color:#1a5a8c;font-weight:bold;font-size:10pt}.dt{color:#64748b;font-size:9.5pt;white-space:nowrap}.sk td{padding:2pt 6pt 2pt 0;font-size:10pt}.st td{background:#eef4fb;text-align:center;padding:6pt;border:3pt solid #fff}
.sn{font-size:16pt;font-weight:bold;color:#1a5a8c}.sl{font-size:7.5pt;color:#64748b;text-transform:uppercase}</style></head><body>
<table width="100%" cellpadding="14" cellspacing="0"><tr><td bgcolor="#1a5a8c"><h1>${e(R.name.toUpperCase())}</h1><p style="color:#dbeafe;font-size:12pt">${e(R.title)}</p><p style="color:#fff;font-size:9.5pt">${e(R.loc)} &nbsp;|&nbsp; ${e(R.email)} &nbsp;|&nbsp; ${e(R.li)} &nbsp;|&nbsp; ${e(R.gh)}</p></td></tr></table>
<table class="st" width="100%" cellspacing="0" style="margin-top:8pt"><tr>${R.stats.map(s=>`<td><span class="sn">${s[0]}</span><br><span class="sl">${e(s[1])}</span></td>`).join('')}</tr></table>
<h2>Professional Summary</h2><p>${e(summary())}</p>
<h2>Technical Skills</h2><table class="sk" width="100%">${R.skills.map(c=>`<tr><td width="34%"><b>${e(c[0])}</b></td><td>${e(c[1].join(', '))}</td></tr>`).join('')}</table>
<h2>Professional Experience</h2>${R.exp.map(x=>ent(x.t,x.d,x.o)+ul(x.b)).join('')}
<h2>Education</h2>${R.edu.map(x=>ent(x.t,x.d,x.o)+ul([x.n])).join('')}
<h2>Certifications</h2><table class="sk" width="100%">${R.certs.map(c=>`<tr><td width="46%"><b>${e(c[0])}</b></td><td>${e(c[1])}</td><td align="right" class="dt">${c[2]}</td></tr>`).join('')}</table>
<h2>Key Achievements</h2><ul>${R.ach.map(a=>`<li><b>${e(a[1])}:</b> ${e(a[2])}</li>`).join('')}</ul>
<h2>Languages</h2><p>${R.langs.map(l=>e(l[0])+' ('+l[1]+')').join(' &nbsp;&nbsp;|&nbsp;&nbsp; ')}</p>
<p style="text-align:center;color:#64748b;margin-top:14pt"><i>References available upon request.</i></p></body></html>`;
 save(new Blob(['\ufeff',h],{type:'application/msword;charset=utf-8'}),FN+'.doc');
}

/* ---- TEXT (clean, aligned, 80-column, ATS-friendly) ---- */
function buildTxt(){
 const W=80;
 const wrap=(s,w,first='',rest='')=>{const out=[];let line=first,empty=true;A(s).split(/\s+/).forEach(x=>{if(!empty&&(line+' '+x).length>w){out.push(line);line=rest+x}else line+=(empty?'':' ')+x;empty=false});out.push(line);return out.join('\n')};
 const L=[],sec=t=>L.push('','',A(t).toUpperCase(),'-'.repeat(W)),
  ent=(t,dt,o)=>{const l=A(t),r=A(dt);L.push('',l+' '.repeat(Math.max(2,W-l.length-r.length))+r,wrap(o,W))};
 L.push(R.name.toUpperCase(),A(R.title),A(R.loc)+' | '+R.email,R.li+' | '+R.gh,'='.repeat(W));
 sec('Professional Summary');L.push(wrap(summary(),W));
 sec('Key Metrics');L.push(R.stats.map(s=>A(s[1])+': '+s[0]).join('\n'));
 sec('Technical Skills');R.skills.forEach(([c,i])=>L.push(c+':',wrap(i.join(', '),W,'  ','  ')));
 sec('Professional Experience');R.exp.forEach(e=>{ent(e.t,e.d,e.o);e.b.forEach(b=>L.push(wrap(b,W,'  - ','    ')))});
 sec('Education');R.edu.forEach(e=>{ent(e.t,e.d,e.o);L.push(wrap(e.n,W,'  - ','    '))});
 sec('Certifications');R.certs.forEach(c=>L.push(wrap(c[0]+' - '+c[1]+' ('+c[2]+')',W,'  - ','    ')));
 sec('Key Achievements');R.ach.forEach(a=>L.push(wrap(a[1]+': '+a[2],W,'  - ','    ')));
 sec('Languages');L.push(R.langs.map(l=>l[0]+' ('+l[1]+')').join(', '));
 L.push('','References available upon request.');
 save(new Blob(['\ufeff'+L.join('\r\n').replace(/\r?\n/g,'\r\n')],{type:'text/plain;charset=utf-8'}),FN+'.txt');
}
</script>
